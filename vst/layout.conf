# Tributary touch layout — Elektron-style: matte black, thin white lines,
# minimal sans-serif text, rounded chiclets, generous empty space.
# No decorative art, no serif type, no coloured lamp, no LEVEL knob.
# TRIBUTARY (single page): header/rule, ACTIVE upper left, a compact LEVEL
# slider + OUT meter upper right, MAIN/DLY/REV/CHO/IN as a left-aligned
# chiclet row, tracks 1-16 as a full-width 2x8 grid of low-profile 128x60
# chiclets (1-8 / 9-16; 20 px horizontal gaps; rows centred at y=550/634, the
# routing row at y=466 — a consistent 24 px between all three rows). The old
# selected-channels readout is gone; the upper middle stays open.
# Global inactive presentation: every non-ACTIVE element exists twice, as a
# when=active:0 (half-brightness neutral gray) / when=active:1 (approved
# look) pair; MPC switches the pairs itself via IndexedEnabling. ACTIVE stays
# full-brightness in both states. CAPTURE keeps its approved layout, styling
# and controls byte-for-byte under the same neutral palette.

